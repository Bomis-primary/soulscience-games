<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Emotion Matcher + Calm Challenge</title>

<style>

*{
box-sizing:border-box;
}

html,body{

margin:0;
padding:0;

min-height:100%;

font-family:
Arial,
Helvetica,
sans-serif;

background:
linear-gradient(
180deg,
#eaf8ff,
#fff8e8
);

color:#24313d;

overflow-x:hidden;

}


button{

font-family:inherit;

cursor:pointer;

}



.screen{

display:none;

min-height:100vh;

padding:15px;

}


.screen.active{

display:flex;

}



.container{

width:min(1100px,100%);

margin:auto;

}



.card{

background:white;

border-radius:25px;

padding:20px;

box-shadow:
0 10px 25px rgba(0,0,0,.12);

}




/* SPLASH */


#splashScreen{

position:fixed;

inset:0;

z-index:9999;

background:white;

align-items:center;

justify-content:center;

}


#splashScreen img{

width:min(80vw,380px);

}





/* START */


.start-card{

text-align:center;

margin:auto;

}



h1{

font-size:
clamp(32px,5vw,55px);

color:#247ba0;

}



.subtitle{

font-size:20px;

line-height:1.5;

color:#52606d;

}



.btn{

padding:15px 30px;

border-radius:18px;

border:none;

font-size:18px;

font-weight:bold;

}


.primary{

background:#247ba0;

color:white;

}





/* GAME */


#gameScreen{

display:none;

}


#gameScreen.active{

display:block;

}



.hud{

display:grid;

grid-template-columns:
repeat(5,1fr);

gap:10px;

margin-bottom:15px;

}



.hud-box{

background:white;

padding:12px;

border-radius:18px;

text-align:center;

font-weight:bold;

box-shadow:
0 5px 15px rgba(0,0,0,.08);

}



.label{

display:block;

font-size:12px;

color:#777;

}



.value{

font-size:22px;

}





.layout{

display:grid;

grid-template-columns:
1.2fr .8fr;

gap:15px;

}



.panel{

background:white;

border-radius:25px;

padding:18px;

}



canvas{

width:100%;

max-width:600px;

display:block;

margin:auto;

aspect-ratio:4/5;

border-radius:25px;

background:

linear-gradient(
180deg,
#dff4ff,
#fff7d6
);

border:3px solid #9ad7f5;

}





.controls{

display:flex;

gap:10px;

justify-content:center;

margin-top:15px;

flex-wrap:wrap;

}



.control{

padding:14px 25px;

border-radius:18px;

background:#ffd166;

border:none;

font-weight:bold;

}




.tip{

background:#f5f9fb;

padding:12px;

border-radius:15px;

margin:10px 0;

line-height:1.4;

}





/* QUIZ */


.overlay{

display:none;

position:fixed;

inset:0;

background:
rgba(0,0,0,.6);

z-index:5000;

align-items:center;

justify-content:center;

padding:15px;

}


.overlay.active{

display:flex;

}



.quiz{

background:white;

width:min(700px,100%);

border-radius:25px;

padding:25px;

}



.option{

display:block;

width:100%;

padding:14px;

margin:10px 0;

border-radius:15px;

border:1px solid #ddd;

background:#eef7ff;

text-align:left;

font-weight:bold;

}



.feedback{

margin-top:15px;

font-weight:bold;

}





/* END */


.end-card{

text-align:center;

margin:auto;

}



.end-card h2{

font-size:40px;

color:#2e7d32;

}





@media(max-width:900px){

.layout{

grid-template-columns:1fr;

}


.hud{

grid-template-columns:
repeat(2,1fr);

}

}



@media(max-width:600px){


.panel,
.card{

padding:14px;

}


.control{

width:100%;

}

}

</style>

</head>


<body>


<div id="splashScreen" class="screen active">

<img
id="innovineLogo"
src="./assets/innovine-logo.png"
alt="Innovine Logo">

</div>




<section id="startScreen" class="screen">

<div class="container">


<div class="card start-card">


<h1>
😊 Emotion Matcher
</h1>


<p class="subtitle">

Match feelings, understand emotions,
and practise calm ways to respond.

</p>


<button
class="btn primary"
onclick="startGame()">

Start Game

</button>


</div>


</div>

</section>





<section id="gameScreen" class="screen">


<div class="container">


<div class="hud">


<div class="hud-box">
<span class="label">Level</span>
<span class="value" id="levelNum">1</span>
</div>


<div class="hud-box">
<span class="label">Score</span>
<span class="value" id="scoreNum">0</span>
</div>


<div class="hud-box">
<span class="label">Lives</span>
<span class="value" id="livesNum">3</span>
</div>


<div class="hud-box">
<span class="label">Goal</span>
<span class="value" id="goalNum">5</span>
</div>


<div class="hud-box">
<span class="label">Stars</span>
<span class="value" id="starsNum">0</span>
</div>


</div>



<div class="layout">


<div class="panel">

<canvas
id="gameCanvas"
width="480"
height="600">
</canvas>


<div class="controls">


<button
class="control"
onclick="moveBasket(-1)">
⬅ Move
</button>


<button
class="control"
onclick="pauseGame()"
id="pauseBtn">
Pause
</button>


<button
class="control"
onclick="moveBasket(1)">
Move ➡
</button>


</div>


</div>




<div class="panel">


<h2>
How to Play
</h2>


<div class="tip">
Catch healthy emotional responses.
</div>


<div class="tip">
Avoid unhealthy choices.
</div>


<div class="tip">
Answer reflection questions to earn stars.
</div>


</div>


</div>


</div>


</section>
<script>

const canvas =
document.getElementById("gameCanvas");

const ctx =
canvas.getContext("2d");


let level=1;
let score=0;
let lives=3;
let stars=0;

let running=false;
let paused=false;


let objects=[];

let timer=null;


let basket={

x:200,

y:540,

w:80,

h:30,

speed:45

};



let emotions=[

{
emoji:"😀",
name:"Joy",
good:true
},

{
emoji:"😢",
name:"Sadness",
good:true
},

{
emoji:"😠",
name:"Anger",
good:true
},

{
emoji:"😨",
name:"Fear",
good:true
},

{
emoji:"😬",
name:"Nervous",
good:true
},


{
emoji:"💥",
name:"Yelling",
good:false
},

{
emoji:"🙈",
name:"Ignoring",
good:false
},

{
emoji:"👊",
name:"Hitting",
good:false
}

];



let questions=[


{
q:"You feel angry. What is a good first step?",

options:[
"Take deep breaths",
"Shout at someone",
"Break something"
],

answer:"Take deep breaths"

},


{
q:"Which sentence shares feelings respectfully?",

options:[
"I feel upset when I am left out",
"You are always wrong",
"I don't care"
],

answer:"I feel upset when I am left out"

},


{
q:"When feelings feel too big, you can...",

options:[
"Talk to a trusted person",
"Keep everything inside",
"Hurt someone"
],

answer:"Talk to a trusted person"

}

];





let quizUsed=false;




function startGame(){


document
.getElementById("startScreen")
.classList
.remove("active");


document
.getElementById("gameScreen")
.classList
.add("active");



level=1;
score=0;
lives=3;
stars=0;


basket.x=200;


objects=[];


running=true;


updateHUD();



clearInterval(timer);


timer=setInterval(
spawnObject,
900
);


gameLoop();


}





function gameLoop(){


if(!running)
return;



if(!paused){

update();

draw();

}



requestAnimationFrame(
gameLoop
);


}




function update(){


objects.forEach(

obj=>{

obj.y+=obj.speed;


}

);



objects=
objects.filter(

obj=>

obj.y<650

);



checkCollision();

}





function spawnObject(){


if(!running || paused)
return;



let item=

emotions[
Math.floor(
Math.random()
*
emotions.length
)
];



objects.push({

x:
Math.random()*420,

y:-50,

emoji:item.emoji,

good:item.good,

speed:
2+level*.4

});


}





function draw(){


ctx.clearRect(
0,
0,
480,
600
);



ctx.fillStyle="#eaf8ff";

ctx.fillRect(
0,
0,
480,
600
);



ctx.fillStyle="#247ba0";


ctx.fillRect(

basket.x,

basket.y,

basket.w,

basket.h

);



ctx.font="38px Arial";


objects.forEach(

obj=>{


ctx.fillText(

obj.emoji,

obj.x,

obj.y

);


}

);


}





function checkCollision(){



for(
let i=objects.length-1;
i>=0;
i--
){


let obj=objects[i];



if(

obj.y>basket.y-20 &&

obj.x>basket.x-30 &&

obj.x<basket.x+basket.w

){


objects.splice(i,1);



if(obj.good){


score++;

stars++;



if(
stars%3===0
){

showQuestion();

}


}

else{


lives--;


if(lives<=0){

endGame();

}


}



updateHUD();


}


}


}





function moveBasket(dir){


basket.x +=
dir*basket.speed;



if(
basket.x<0
)

basket.x=0;



if(
basket.x+basket.w>480
)

basket.x=
400;


}





function pauseGame(){


paused=!paused;


document
.getElementById("pauseBtn")
.textContent=

paused?
"Resume":
"Pause";


}







function updateHUD(){


document
.getElementById("levelNum")
.textContent=level;


document
.getElementById("scoreNum")
.textContent=score;


document
.getElementById("livesNum")
.textContent=lives;


document
.getElementById("goalNum")
.textContent=
5+level;


document
.getElementById("starsNum")
.textContent=stars;


}






function showQuestion(){


paused=true;



let q=

questions[
Math.floor(
Math.random()
*
questions.length
)
];



let answer=

prompt(
q.q+
"\n\n"+
q.options.join("\n")
);



if(
answer===q.answer
){

stars+=2;

score+=5;


}



updateHUD();



paused=false;


}







function endGame(){


running=false;


clearInterval(timer);



document
.getElementById("gameScreen")
.classList
.remove("active");



document
.getElementById("endScreen")
.classList
.add("active");



}






/* keyboard */


document.addEventListener(

"keydown",

e=>{


if(
e.key==="ArrowLeft"
)

moveBasket(-1);



if(
e.key==="ArrowRight"
)

moveBasket(1);



}

);





/* splash */


setTimeout(

()=>{


document
.getElementById("splashScreen")
.classList
.remove("active");

document
.getElementById("startScreen")
.classList
.add("active");


},

3000

);



</script>


</body>

</html>
